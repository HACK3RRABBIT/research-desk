[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-desk"
version = "0.1.0"
description = "Personal real-time X/Twitter news intelligence desk (multi-agent research system)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "tomli>=2.0; python_version < '3.11'",
    "tomli_w>=1.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
research-desk = "research_desk.cli:main"

[tool.setuptools]
packages = ["research_desk", "research_desk.agents", "research_desk.ingest"]
