# Research Desk configuration
# Copy and edit. All fields are optional; defaults live in research_desk/config.py.

# Your RSSHub instance. Self-host for reliability: https://docs.rsshub.app/
rsshub_base_url = "https://rsshub.app"

# Seconds between pipeline cycles when running `research-desk run`.
poll_interval = 300

# Keep posts in these languages (two-letter ISO codes).
languages = ["en"]

# RSSHub /twitter/user/:id feeds. Handles without the leading @.
watched_users = [
    # "FloodProtocol",
]

# RSSHub /twitter/list/:id feeds (numeric list ids).
watched_lists = []

# RSSHub /twitter/keyword/:keyword feeds.
watched_keywords = [
    "breaking",
    "sanctions",
    "oil",
    "Iran",
]

# X API v2 recent-search queries (used only if X_API_BEARER env var is set).
x_search_queries = []

[preferences]
boost_themes = [
    "official announcement",
    "energy", "oil", "gas", "sanctions", "shipping", "markets",
    "ai", "x", "tech platform",
    "geopolitics", "iran", "policy", "security",
]
ignore_themes = [
    "celebrity", "sports", "teaser marketing", "gossip",
]
min_importance = 0.0

# Intelligence engine (always-on). Defaults to an OpenAI-compatible endpoint;
# set base_url + model + api_key here OR in the webui Settings -> AI Engine
# screen, which persists them to the gitignored config.local.toml. Leave
# base_url/model empty until you're ready to wire up a model.
[llm]
provider = "openai"
base_url = ""
model = ""
temperature = 0.0
max_tokens = 1024
timeout = 60
api_key = ""

# Automatic discovery of new accounts (bounded). The desk learns new sources
# from the posts it reads instead of staying on a fixed watchlist.
[discovery]
enabled = true
max_per_cycle = 5
max_total = 50

# Scheduler: begin polling automatically once an engine is configured.
[scheduler]
autostart = true

# Where state lives (SQLite db + markdown briefs). Relative to cwd.
data_dir = "data"
